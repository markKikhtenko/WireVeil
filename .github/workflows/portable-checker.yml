name: Build portable checker

on:
  push:
    branches: [main]
    tags:
      - "checker-v*"
    paths:
      - "checker_app.py"
      - "mihomo_tab.py"
      - "scripts/build.py"
      - "scripts/healthcheck.py"
      - "scripts/local_checker.py"
      - "scripts/mihomo_checker.py"
      - "scripts/mihomo_smoke.py"
      - "requirements.txt"
      - "tests/**"
      - "assets/**"
      - "PORTABLE-CHECKER.md"
      - "README.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/portable-checker.yml"
  pull_request:
    branches: [main]
    paths:
      - "checker_app.py"
      - "mihomo_tab.py"
      - "scripts/build.py"
      - "scripts/healthcheck.py"
      - "scripts/local_checker.py"
      - "scripts/mihomo_checker.py"
      - "scripts/mihomo_smoke.py"
      - "tests/**"
      - "assets/**"
      - "requirements.txt"
      - "PORTABLE-CHECKER.md"
      - "README.md"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/portable-checker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out WireVeil
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies and packager
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.16.0

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Download pinned sing-box runtime
        shell: pwsh
        env:
          SING_BOX_VERSION: "1.14.0"
          SING_BOX_ARCHIVE_SHA256: "3ffb56267da14e287be48bd10cf7e6505260125bad940b75101fbb4d5d58e5d6"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box.zip"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$env:SING_BOX_VERSION/sing-box-$env:SING_BOX_VERSION-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:SING_BOX_ARCHIVE_SHA256) {
            throw "sing-box archive checksum mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $runtime = Join-Path $env:RUNNER_TEMP "sing-box-$env:SING_BOX_VERSION-windows-amd64"
          "WIREVEIL_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download pinned Mihomo runtime
        shell: pwsh
        env:
          MIHOMO_VERSION: "1.19.33"
          MIHOMO_ARCHIVE_SHA256: "6ab2180875f9f6fff8b19386d760daec257f66b45f72b3afc650634272fa837a"
          MIHOMO_LICENSE_SHA256: "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986"
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mihomo.zip"
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/v$env:MIHOMO_VERSION/mihomo-windows-amd64-v$env:MIHOMO_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MIHOMO_ARCHIVE_SHA256) {
            throw "Mihomo archive checksum mismatch: $actual"
          }
          $runtime = Join-Path $env:RUNNER_TEMP "wireveil-mihomo"
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $source = Get-ChildItem -LiteralPath $runtime -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $source) {
            throw "Mihomo executable was not found in the verified archive."
          }
          $target = Join-Path $runtime "mihomo.exe"
          if ($source.FullName -ne $target) {
            Copy-Item -LiteralPath $source.FullName -Destination $target
          }
          $license = Join-Path $runtime "LICENSE"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MetaCubeX/mihomo/v$env:MIHOMO_VERSION/LICENSE" -OutFile $license
          $licenseHash = (Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($licenseHash -ne $env:MIHOMO_LICENSE_SHA256) {
            throw "Mihomo license checksum mismatch: $licenseHash"
          }
          "WIREVEIL_MIHOMO=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIREVEIL_MIHOMO_LICENSE=$license" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name WireVeilChecker `
            --icon assets\wireveil-icon.ico `
            --add-data "assets\wireveil-icon.ico;." `
            --add-binary "$env:WIREVEIL_RUNTIME\sing-box.exe;." `
            --add-binary "$env:WIREVEIL_RUNTIME\libcronet.dll;." `
            --add-binary "$env:WIREVEIL_MIHOMO;." `
            checker_app.py
          Copy-Item -LiteralPath PORTABLE-CHECKER.md -Destination dist\WireVeilChecker\README.txt
          Copy-Item -LiteralPath THIRD-PARTY-NOTICES.md -Destination dist\WireVeilChecker\THIRD-PARTY-NOTICES.md
          Copy-Item -LiteralPath "$env:WIREVEIL_RUNTIME\LICENSE" -Destination dist\WireVeilChecker\sing-box-LICENSE.txt
          Copy-Item -LiteralPath "$env:WIREVEIL_MIHOMO_LICENSE" -Destination dist\WireVeilChecker\mihomo-GPL-3.0.txt

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Warning "Signing certificate is not configured; binaries and release archive remain unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "wireveil-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            if (-not $signTool) {
              throw "signtool.exe was not found on the GitHub runner."
            }
            $targets = @(
              "dist\WireVeilChecker\WireVeilChecker.exe",
              "dist\WireVeilChecker\_internal\sing-box.exe",
              "dist\WireVeilChecker\_internal\mihomo.exe",
              "dist\WireVeilChecker\_internal\libcronet.dll"
            )
            foreach ($target in $targets) {
              & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
                /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $target
              if ($LASTEXITCODE -ne 0) {
                throw "Authenticode signing failed for $target"
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $target
              if ($signature.Status -ne "Valid") {
                throw "Authenticode verification failed for $target`: $($signature.Status)"
              }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path dist\WireVeilChecker -DestinationPath WireVeilChecker-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath WireVeilChecker-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *WireVeilChecker-windows-x64.zip" | Set-Content -LiteralPath WireVeilChecker-windows-x64.zip.sha256 -Encoding ascii

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: WireVeilChecker-windows-x64
          path: |
            WireVeilChecker-windows-x64.zip
            WireVeilChecker-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Attach archive to tagged release
        if: startsWith(github.ref, 'refs/tags/checker-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            WireVeilChecker-windows-x64.zip
            WireVeilChecker-windows-x64.zip.sha256
