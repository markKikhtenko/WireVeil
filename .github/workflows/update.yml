name: Update subscriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "sources.json"
      - "tests/**"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wireveil-subscription-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out WireVeil
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build subscriptions
        run: python scripts/build.py

      - name: Install pinned sing-box health-check runtime
        shell: bash
        env:
          SING_BOX_VERSION: "1.14.0"
          SING_BOX_SHA256: "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63"
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          runtime="$RUNNER_TEMP/sing-box-$SING_BOX_VERSION-linux-amd64"
          curl --fail --location --silent --show-error \
            "https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz" \
            --output "$archive"
          echo "$SING_BOX_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$runtime" >> "$GITHUB_PATH"

      - name: Probe real tunneled HTTPS connections
        run: >-
          python scripts/healthcheck.py
          --sing-box "$(command -v sing-box)"
          --min-active 10
          --timeout-ms 8000
          --workers 64

      - name: Commit real output changes
        shell: bash
        run: |
          git add -- README.md subscription.txt active.txt active-stats.json vless.txt trojan.txt shadowsocks.txt vmess.txt hysteria.txt hysteria2.txt tuic.txt stats.json update-history.json
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
            exit 0
          fi
          git add -- geo-cache.json
          total="$(python -c 'import json; print(json.load(open("stats.json", encoding="utf-8"))["total_keys"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update WireVeil subscriptions (${total} keys)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after ${attempt} attempts." >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Push attempt ${attempt} failed; retrying in ${delay} seconds..." >&2
            sleep "$delay"
          done
