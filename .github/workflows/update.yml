name: Update subscriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"
      - "sources.json"
      - "healthcheck-config.json"
      - "requirements.txt"
      - "tests/**"
  schedule:
    # Four times per day, away from the busy start-of-hour window.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wireveil-subscription-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out WireVeil
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --retries 10
          --timeout 60
          -r requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Build subscriptions
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/build.py --timeout 30 --retries 5; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Subscription build failed after ${attempt} attempts." >&2
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Subscription build attempt ${attempt} failed; retrying in ${delay} seconds..." >&2
            sleep "$delay"
          done

      - name: Install pinned sing-box health-check runtime
        shell: bash
        env:
          SING_BOX_VERSION: "1.14.0"
          SING_BOX_SHA256: "2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          runtime="$RUNNER_TEMP/sing-box-$SING_BOX_VERSION-linux-amd64"
          asset_name="sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz"
          release_json="$(
            curl --fail --location --silent --show-error \
              --connect-timeout 20 --max-time 180 \
              --retry 8 --retry-delay 10 --retry-all-errors \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/SagerNet/sing-box/releases/tags/v$SING_BOX_VERSION"
          )"
          asset_api_url="$(
            python -c 'import json, sys; name = sys.argv[1]; release = json.load(sys.stdin); print(next(asset["url"] for asset in release["assets"] if asset["name"] == name))' \
              "$asset_name" <<<"$release_json"
          )"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/octet-stream" \
            "$asset_api_url" \
            --output "$archive"
          echo "$SING_BOX_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$runtime" >> "$GITHUB_PATH"

      - name: Probe real tunneled HTTPS connections
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/healthcheck.py \
              --sing-box "$(command -v sing-box)" \
              --min-active 10 \
              --timeout-ms 8000 \
              --workers 64; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Subscription health-check failed after ${attempt} attempts." >&2
              exit 1
            fi
            delay=$((attempt * 30))
            echo "Subscription health-check attempt ${attempt} failed; retrying in ${delay} seconds..." >&2
            sleep "$delay"
          done

      - name: Commit real output changes
        shell: bash
        run: |
          git add -- README.md subscription.txt active.txt good.txt active-stats.json vless.txt trojan.txt shadowsocks.txt vmess.txt hysteria.txt hysteria2.txt tuic.txt stats.json update-history.json
          if git diff --cached --quiet; then
            echo "No subscription changes to commit."
            exit 0
          fi
          git add -- geo-cache.json
          total="$(python -c 'import json; print(json.load(open("stats.json", encoding="utf-8"))["total_keys"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update WireVeil subscriptions (${total} keys)"
          run_base="$(git rev-parse HEAD^)"
          for attempt in 1 2 3; do
            if git fetch origin +refs/heads/main:refs/remotes/origin/main; then
              if ! git merge-base --is-ancestor "$run_base" origin/main; then
                echo "::notice::main history was rewritten while this run was active; skipping stale generated output."
                exit 0
              fi

              changed_inputs="$(
                git diff --name-only "$run_base"..origin/main -- \
                  .github/workflows/update.yml \
                  scripts \
                  sources.json \
                  healthcheck-config.json \
                  requirements.txt \
                  tests
              )"
              if [ -n "$changed_inputs" ]; then
                echo "::notice::main changed workflow inputs while this run was active; skipping stale generated output."
                printf 'Changed inputs:\n%s\n' "$changed_inputs"
                exit 0
              fi

              if ! git rebase origin/main; then
                git rebase --abort
                echo "::notice::main changed generated output while this run was active; skipping the stale update."
                exit 0
              fi

              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Publishing failed after ${attempt} synchronized attempts." >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Publish attempt ${attempt} failed; synchronizing again in ${delay} seconds..." >&2
            sleep "$delay"
          done
